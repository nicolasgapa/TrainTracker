name: Collect arrivals

on:
  schedule:
    - cron: "7 * * * *"   # every hour (GitHub may start it a few minutes late)
  workflow_dispatch:       # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collect.py
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arrivals.csv
          git diff --cached --quiet || git commit -m "Collect arrivals $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
